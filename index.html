<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lazy Crossword</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Lazy Crossword</p>
          <h1>Cruciverba per Benzi</h1>
        </div>
        <div class="status-bar" aria-live="polite">
          <span id="completion">Completamento: 0%</span>
          <span id="timer">00:00</span>
        </div>
      </header>

      <main class="layout">
        <div class="play-area">
          <section class="controls-panel" aria-label="Comandi cruciverba">
            <div class="toolbar" aria-label="Azioni cruciverba">
              <div class="toolbar-main">
                <button type="button" id="check-button">Controlla</button>
                <button type="button" id="reset-button">Reset</button>
                <button type="button" id="new-button">Nuovo cruciverba</button>
                <button type="button" id="theme-button" aria-pressed="false">Tema scuro</button>
              </div>
              <div class="toolbar-solution">
                <button type="button" id="solve-button">Mostra soluzione</button>
              </div>
            </div>

            <p id="message" class="message" aria-live="polite"></p>
            <section id="stats-panel" class="stats-panel" aria-live="polite" hidden>
              <h2>Statistiche</h2>
              <div id="stats-list" class="stats-list"></div>
            </section>
          </section>

          <section class="crossword-panel" aria-label="Cruciverba">
            <div class="grid-wrap">
              <div id="grid" class="crossword-grid" aria-label="Griglia cruciverba"></div>
            </div>
          </section>
        </div>

        <aside class="clues-panel" aria-label="Definizioni">
          <h2>Definizioni</h2>

          <section class="clue-group" aria-labelledby="across-title">
            <h3 id="across-title">Orizzontali</h3>
            <ol id="across-clues" class="clue-list"></ol>
          </section>

          <section class="clue-group" aria-labelledby="down-title">
            <h3 id="down-title">Verticali</h3>
            <ol id="down-clues" class="clue-list"></ol>
          </section>
        </aside>
      </main>
    </div>

    <div id="confirm-overlay" class="confirm-overlay" hidden>
      <section
        class="confirm-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-message"
      >
        <h2 id="confirm-title">Conferma</h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel" class="confirm-cancel">Annulla</button>
          <button type="button" id="confirm-accept" class="confirm-accept">Conferma</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
